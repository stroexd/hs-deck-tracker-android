name: Android CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Check 16 KB page alignment
        run: python3 scripts/check_16kb_alignment.py app/build/outputs/apk/release/app-release.apk

      - name: Build the F-Droid repository (throwaway key)
        run: |
          pipx install fdroidserver==2.4.5
          export SIGNING_PASSWORD=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.p12" -storetype PKCS12 -alias fdroid -keyalg RSA \
            -keysize 2048 -validity 1 -dname "CN=Test" -storepass:env SIGNING_PASSWORD
          scripts/fdroid-repo.sh app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/test.p12" "$RUNNER_TEMP/fdroid"
          ls -R "$RUNNER_TEMP/fdroid/repo"
          test -f "$RUNNER_TEMP/fdroid/repo/entry.jar"
          ls "$RUNNER_TEMP"/fdroid/repo/com.stroexd.hsdecktracker_*.apk
          cmp fastlane/metadata/android/en-US/images/icon.png "$RUNNER_TEMP/fdroid/repo/icons/icon.png"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-deck-tracker-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
