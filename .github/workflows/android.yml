name: Android CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build APK (GitHub) and bundle (Play)
        run: ./gradlew --no-daemon :app:assembleGithubRelease :app:bundlePlayRelease

      - name: Check 16 KB page alignment (Play)
        run: python3 scripts/check_16kb_alignment.py app/build/outputs/bundle/playRelease/*.aab

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-deck-tracker-apk
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
