# Builds a signed release: the App Bundle for Google Play and the APK for GitHub.
# Start it from the Actions tab or push a tag like v1.3.0 (that also creates a GitHub release).
name: Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unlock the upload key
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ ! -f signing/upload.p12.enc ]; then
            echo "::error::No upload key yet: run the 'Create upload key' workflow first"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/upload.p12.enc -out "$RUNNER_TEMP/upload.p12" \
            -pass env:UPLOAD_KEY_PASSWORD
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          VERSION_ARGS="-PversionCode=$((100 + GITHUB_RUN_NUMBER))"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION_ARGS="$VERSION_ARGS -PversionName=${GITHUB_REF_NAME#v}"; fi
          ./gradlew --no-daemon :core:test :app:bundlePlayRelease :app:assembleGithubRelease $VERSION_ARGS

      - name: Check 16 KB page alignment
        run: python3 scripts/check_16kb_alignment.py app/build/outputs/bundle/playRelease/*.aab

      - name: Upload the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-deck-tracker-apk
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/github/release/*.apk --generate-notes

      # Optional: with a service account from the Play Console, releases go straight to internal testing
      - name: Upload to Google Play (internal testing)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.stroexd.hsdecktracker
          releaseFiles: app/build/outputs/bundle/playRelease/*.aab
          track: internal
          status: completed
