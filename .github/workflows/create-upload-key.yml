# Run once: creates the key that signs uploads to Google Play and stores it encrypted in the repo.
# Needs the repository secret UPLOAD_KEY_PASSWORD (long and random); keep it in a password manager.
name: Create upload key

on: workflow_dispatch

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Create and encrypt the key
        env:
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ ${#UPLOAD_KEY_PASSWORD} -lt 20 ]; then
            echo "::error::Add a repository secret UPLOAD_KEY_PASSWORD with at least 20 random characters"; exit 1
          fi
          if [ -e signing/upload.p12.enc ]; then
            echo "::error::There already is an upload key (signing/upload.p12.enc)"; exit 1
          fi
          keytool -genkeypair -keystore "$RUNNER_TEMP/upload.p12" -storetype PKCS12 -alias upload \
            -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=HS Deck Tracker" -storepass:env UPLOAD_KEY_PASSWORD
          keytool -list -v -keystore "$RUNNER_TEMP/upload.p12" -storepass:env UPLOAD_KEY_PASSWORD | grep "SHA256:"
          mkdir -p signing
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/upload.p12" -out signing/upload.p12.enc \
            -pass env:UPLOAD_KEY_PASSWORD
          rm "$RUNNER_TEMP/upload.p12"

      - name: Commit the encrypted key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/upload.p12.enc
          git commit -m "Add encrypted upload key"
          git push
