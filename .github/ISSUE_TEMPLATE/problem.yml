name: Problem
description: Something isn't recognized, looks wrong or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: English or German, both are fine. / Deutsch oder Englisch, beides passt.
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Game start, classes or result
        - My deck or drawn cards
        - Opponent's cards or deck prediction
        - Overlay
        - Collection, packs or crafting
        - Decks, meta or card database
        - Match history or stats
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Screenshots or diagnostics
      description: >-
        For recognition problems a screenshot helps most. Even better: turn on Settings → "Record diagnostics",
        play until it happens, then "Share diagnostics" and drop the zip file here.
  - type: input
    id: version
    attributes:
      label: App version
  - type: input
    id: device
    attributes:
      label: Device and Android version
  - type: dropdown
    id: tracking
    attributes:
      label: Tracking via
      options:
        - Background tracking (accessibility)
        - Screen sharing
        - Not relevant
